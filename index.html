<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas App</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111b21" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
</head>
<body>
    <div class="app-container">
        <!-- Menú hamburguesa lateral -->
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="side-menu" id="sideMenu">
            <div class="menu-header">
                <h2><i class="fas fa-wallet"></i> Finanzas</h2>
                <button class="close-menu" id="closeMenu"><i class="fas fa-times"></i></button>
            </div>
            <nav class="menu-nav">
                <a href="#" class="menu-item active" data-view="dashboard"><i class="fas fa-chart-pie"></i> Resumen</a>
                <a href="#" class="menu-item" data-view="alcancia"><i class="fas fa-piggy-bank"></i> Alcancía</a>
                <a href="#" class="menu-item" data-view="monedero"><i class="fas fa-coins"></i> Monedero</a>
                <a href="#" class="menu-item" data-view="tarjetas"><i class="fas fa-credit-card"></i> Tarjetas</a>
                <a href="#" class="menu-item" data-view="ingresos"><i class="fas fa-arrow-down"></i> Ingresos</a>
                <a href="#" class="menu-item" data-view="gastos"><i class="fas fa-arrow-up"></i> Gastos</a>
                <a href="#" class="menu-item" data-view="deudas"><i class="fas fa-hand-holding-usd"></i> Deudas</a>
                <a href="#" class="menu-item" data-view="prestamos"><i class="fas fa-handshake"></i> Préstamos</a>
                <a href="#" class="menu-item" data-view="divisas"><i class="fas fa-dollar-sign"></i> Divisas</a>
            </nav>
            
            <div class="menu-version">
                <span class="version-text"><i class="fas fa-bolt"></i> v2.0.0</span>
            </div>
            
            <div class="menu-footer">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> Oscuro</button>
                <button class="reset-button" id="resetData"><i class="fas fa-trash-alt"></i> Reiniciar datos</button>
            </div>
        </div>

        <!-- Header principal -->
        <header class="header">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <h1 class="header-title" id="headerTitle"><i class="fas fa-home"></i> Resumen</h1>
            <div class="header-actions">
                <span class="total-general" id="totalGeneral">0.00 $</span>
                <span class="total-general" id="totalGeneralUSD" style="font-size:0.8rem; margin-left:0.5rem; opacity:0.7;">0.00 USD</span>
            </div>
        </header>

        <!-- Contenido principal -->
        <main class="main-content" id="mainContent">
            <!-- Aquí se cargará cada vista dinámicamente -->
        </main>
    </div>

    <!-- Modal personalizado para entradas -->
    <div class="modal" id="customModal" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle"><i class="fas fa-edit"></i> Ingresar datos</h3>
            <input type="text" class="modal-input" id="modalInput" placeholder="Escribe aquí...">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="modalCancel"><i class="fas fa-times"></i> Cancelar</button>
                <button class="modal-btn confirm" id="modalConfirm"><i class="fas fa-check"></i> Aceptar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Scripts modulares -->
    <script src="js/components/alcancia.js"></script>
    <script src="js/components/monedero.js"></script>
    <script src="js/components/tarjetas.js"></script>
    <script src="js/components/ingresos.js"></script>
    <script src="js/components/gastos.js"></script>
    <script src="js/components/dashboard.js"></script>
    <script src="js/components/deudas.js"></script>
    <script src="js/components/prestamos.js"></script>
    <script src="js/components/divisas.js"></script>
    <script src="js/app.js"></script>

    <!-- Inicialización -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof FinanzasApp !== 'undefined' && FinanzasApp) {
                    FinanzasApp.init();
                } else {
                    console.error('FinanzasApp no está definido');
                }
            }, 100);
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado correctamente:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        } else {
            console.log('⚠️ Service Workers no soportados en este navegador');
        }
    </script>
</body>
</html>
